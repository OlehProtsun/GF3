<svg viewBox="110 110 1316 1316" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="768" y1="178" x2="768" y2="1348" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F6F7F9"/>
    </linearGradient>

    <linearGradient id="frame" x1="768" y1="392" x2="768" y2="1188" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F1F2F4"/>
      <stop offset="1" stop-color="#DDE1E6"/>
    </linearGradient>

    <linearGradient id="blue" x1="520" y1="1030" x2="1000" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1590FF"/>
      <stop offset="1" stop-color="#39B7FF"/>
    </linearGradient>

    <filter id="tileShadow" x="110" y="110" width="1316" height="1316" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#B8BEC8" flood-opacity="0.28"/>
    </filter>

    <filter id="frameShadow" x="250" y="250" width="1040" height="1040" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#C8CDD4" flood-opacity="0.20"/>
      <feDropShadow dx="0" dy="-2" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.95"/>
    </filter>

    <filter id="blueShadow" x="420" y="560" width="660" height="540" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#178EFF" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- iOS-like tile -->
  <rect
    x="188"
    y="178"
    width="1160"
    height="1170"
    rx="240"
    fill="url(#bg)"
    filter="url(#tileShadow)"
  />

  <!-- Grey calendar frame -->
  <g filter="url(#frameShadow)">
    <rect
      x="358"
      y="438"
      width="820"
      height="750"
      rx="124"
      stroke="url(#frame)"
      stroke-width="66"
      fill="none"
    />

    <line
      x1="570"
      y1="392"
      x2="570"
      y2="500"
      stroke="url(#frame)"
      stroke-width="66"
      stroke-linecap="round"
    />

    <line
      x1="970"
      y1="392"
      x2="970"
      y2="500"
      stroke="url(#frame)"
      stroke-width="66"
      stroke-linecap="round"
    />
  </g>

  <!-- Blue inner symbol -->
  <g filter="url(#blueShadow)">
    <path
      d="
        M578 966
        L578 854
        C578 766 647 704 734 704
        C817 704 854 756 854 818
        C854 868 825 892 790 907
        C758 921 741 944 741 970
        C741 1006 773 1026 818 1026
        C918 1026 968 942 968 812
        L968 694
      "
      stroke="url(#blue)"
      stroke-width="74"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />

    <circle cx="578" cy="966" r="60" fill="url(#blue)"/>
    <circle cx="968" cy="694" r="62" fill="url(#blue)"/>
  </g>
</svg>