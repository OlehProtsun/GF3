name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FrontEnd/package-lock.json

      - name: Restore backend
        run: dotnet restore GF3.Tests/GF3.Tests.csproj

      - name: Test backend
        run: dotnet test GF3.Tests/GF3.Tests.csproj --configuration Release --no-restore

      - name: Install frontend dependencies
        working-directory: FrontEnd
        run: npm ci

      - name: Lint frontend
        working-directory: FrontEnd
        run: npm run lint

      - name: Test frontend
        working-directory: FrontEnd
        run: npm run test

      - name: Build frontend
        working-directory: FrontEnd
        run: npm run build

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t gf3-web:ci .
