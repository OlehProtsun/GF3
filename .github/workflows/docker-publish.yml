name: Publish Docker image

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag, for example 2026-05-22-1
        required: true
        default: latest

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and push GHCR image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/gf3" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ inputs.image_tag }}
            ${{ steps.image.outputs.name }}:latest
