name: gf3

services:
  gf3-app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: ${GF3_IMAGE:-gf3-web:local}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    env_file:
      - ./.env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      DOTNET_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      GF3_TRUSTED_PROXY_CIDR: ${GF3_TRUSTED_PROXY_CIDR:-}
      AllowedHosts: "${GF3_SERVER_NAME:-localhost};localhost;127.0.0.1"
      ConnectionStrings__Default: "Data Source=/data/SQLite.db"
      GF3_CONNECTION_STRING: "Data Source=/data/SQLite.db"
      GF3_EXPORT_TEMPLATES_DIR: /app/Resources/ExcelTemplate
      GF3_ADMIN_ENABLED: ${GF3_ADMIN_ENABLED:-false}
      GF3_ADMIN_ALLOW_REMOTE: ${GF3_ADMIN_ALLOW_REMOTE:-false}
      GF3_ADMIN_ALLOW_WRITE: ${GF3_ADMIN_ALLOW_WRITE:-false}
      GF3_ADMIN_DEVELOPER_PASSWORD: ${GF3_ADMIN_DEVELOPER_PASSWORD:?Set GF3_ADMIN_DEVELOPER_PASSWORD in deploy/.env}
      GF3_BOOTSTRAP_MANAGER_PASSWORD: ${GF3_BOOTSTRAP_MANAGER_PASSWORD:?Set GF3_BOOTSTRAP_MANAGER_PASSWORD in deploy/.env}
      DatabaseStartup__RequireExistingDatabase: ${GF3_REQUIRE_EXISTING_DATABASE:-true}
      DatabaseStartup__BackupBeforeMigrate: ${GF3_BACKUP_BEFORE_MIGRATE:-true}
    volumes:
      - gf3-data:/data
    expose:
      - "8080"
    networks:
      - gf3-internal
    stop_grace_period: 30s

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    depends_on:
      gf3-app:
        condition: service_healthy
    environment:
      GF3_SERVER_NAME: ${GF3_SERVER_NAME:-localhost}
      NGINX_ENVSUBST_FILTER: ^GF3_SERVER_NAME$
    ports:
      - "${GF3_HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/http-templates/gf3.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./security/runtime/nginx:/etc/nginx/gf3-security:ro
      - ./security/runtime/logs:/var/log/nginx/gf3-security
    networks:
      - gf3-internal

networks:
  gf3-internal:
    driver: bridge

volumes:
  gf3-data:
    name: ${GF3_DATA_VOLUME:-gf3-data}
